services:
  - type: web
    name: cybersa-learn
    runtime: python
    region: frankfurt
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cybersa-postgres
          property: connectionString
      - key: CYBERSA_RESEARCHER_PASSWORD
        sync: false

databases:
  - name: cybersa-postgres
    databaseName: cybersa
    user: cybersa_app
    region: frankfurt
    plan: 0.1c-256mb
    diskSizeGB: 1
